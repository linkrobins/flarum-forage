linkrobins-forage:
  admin:
    key_label: Forage key
    key_help: >
      Paste the key from your linkrobins.com dashboard → Forage. That's it —
      Forage sets up your search server's connection for you and starts indexing
      your posts. Leave it blank to go back to your forum's own search.

    unconfigured: >
      Paste your Forage key below to turn on hosted search. Get it from your
      linkrobins.com dashboard → Forage. Until then your forum keeps using its
      own search, so nothing is broken in the meantime.

    connected: >
      ✓ Connected — your forum's search is being answered by your own search
      server.
    connected_indexed: >
      ✓ Connected — your forum's search is being answered by your own search
      server, which is holding {indexed} posts.

    provisioning: >
      Your key is fine, and your search server is still being built. That takes
      a minute or two after subscribing. Your forum's own search is being used
      until it's ready.
    check_again: Check again

    invalid: >
      That key wasn't recognized. Check that you copied it in full, and that
      your Forage subscription is still active. Your forum's own search is being
      used in the meantime.
    invalid_still_connected: >
      That key wasn't recognized, so it hasn't been used. Check that you copied
      it in full, and that your Forage subscription is still active. Your forum
      is still searching through the key it had before, so nothing has stopped
      working.

    error: >
      Forage couldn't finish setting up. Your forum's own search is still
      working, so nothing is broken for your members. Try saving your key again,
      and get in touch if it keeps happening.
    error_still_connected: >
      Forage couldn't check that key, so it hasn't been used. Your forum is
      still searching through the key it had before, so nothing has stopped
      working. Try saving again, and get in touch if it keeps happening.

    unreachable: >
      Your setup is fine, but your search server isn't answering right now. Your
      forum's own search is being used in the meantime, so members can still
      search.

    at_limit: >
      Your search server is holding {indexed} posts, which is the limit on your
      plan ({cap}). Newer posts aren't being added, so they won't turn up in
      search. Upgrading your plan raises the limit.
